# Font Configuration
font_family      family="JetBrainsMono Nerd Font"

allow_remote_control yes

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
# scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

map ctrl+shift+[ move_window left
map ctrl+shift+] move_window right
map ctrl+shift+; move_window down
map ctrl+shift+' move_window up

map ctrl+[ neighboring_window left
map ctrl+] neighboring_window right
map ctrl+; neighboring_window down 
map ctrl+' neighboring_window up

map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+o launch --location=vsplit --cwd=current

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf
background_opacity 0.93
dim_opacity 0.4

# BEGIN_KITTY_THEME
# Embark
include embark-theme.conf
# END_KITTY_THEME

# map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting less +G
scrollback_pager less --RAW-CONTROL-CHARS --chop-long-lines +INPUT_LINE_NUMBER
map ctrl+shift+h show_scrollback
